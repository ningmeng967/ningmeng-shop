<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" fill="none">
<title>云感 Air 无线耳机展示插画</title>
<defs>
  <linearGradient id="bg" x1="120" y1="20" x2="840" y2="700" gradientUnits="userSpaceOnUse">
    <stop stop-color="#dce7d8"/><stop offset="0.55" stop-color="#e8eadc"/><stop offset="1" stop-color="#f2e7d8"/>
  </linearGradient>
  <pattern id="microdots" width="20" height="20" patternUnits="userSpaceOnUse">
    <circle cx="1.4" cy="1.4" r="1.1" fill="#2f3c32" opacity=".13"/>
  </pattern>
  <filter id="drop" x="-60%" y="-60%" width="220%" height="220%">
    <feDropShadow dx="0" dy="24" stdDeviation="26" flood-color="#201d17" flood-opacity=".24"/>
  </filter>
  <filter id="dropSoft" x="-60%" y="-60%" width="220%" height="220%">
    <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#201d17" flood-opacity=".17"/>
  </filter>
  <filter id="blurSoft" x="-80%" y="-80%" width="260%" height="260%">
    <feGaussianBlur stdDeviation="24"/>
  </filter>
  <linearGradient id="sheen" x1="0.1" y1="0" x2="0.9" y2="1">
    <stop stop-color="#ffffff" stop-opacity=".28"/>
    <stop offset=".45" stop-color="#ffffff" stop-opacity="0"/>
    <stop offset="1" stop-color="#ffffff" stop-opacity=".1"/>
  </linearGradient>
</defs>
<rect width="960" height="720" fill="url(#bg)"/>
<circle cx="810" cy="120" r="300" fill="#7f9a80" opacity=".10"/>
<circle cx="810" cy="120" r="235" stroke="#2f3c32" stroke-opacity=".10"/>
<circle cx="100" cy="612" r="210" fill="#7f9a80" opacity=".06"/>
<rect x="690" y="390" width="190" height="130" fill="url(#microdots)" opacity=".7"/>
<g fill="#2f3c32" opacity=".55" font-family="Helvetica, Arial, sans-serif">
  <text x="48" y="55" font-size="10.5" letter-spacing="4.2">JIANWU / AUDIO</text>
  <text x="912" y="55" font-size="10.5" letter-spacing="2.6" text-anchor="end">01 / 04</text>
</g>
<line x1="48" y1="77" x2="912" y2="77" stroke="#2f3c32" stroke-opacity=".14"/>
<defs>
  <linearGradient id="budBody" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#fffdf8"/><stop offset=".55" stop-color="#eee9de"/><stop offset="1" stop-color="#c9c5b9"/>
  </linearGradient>
  <linearGradient id="budStem" x1="0" y1="0" x2="1" y2="0">
    <stop stop-color="#f7f4ec"/><stop offset=".48" stop-color="#fffdf7"/><stop offset=".8" stop-color="#dcd8cb"/><stop offset="1" stop-color="#bbb8ad"/>
  </linearGradient>
  <linearGradient id="caseBody" x1="0" y1="0" x2="0.8" y2="1">
    <stop stop-color="#fffdf7"/><stop offset=".52" stop-color="#efebe0"/><stop offset="1" stop-color="#cac6b9"/>
  </linearGradient>
  <linearGradient id="caseLid" x1="0" y1="0" x2="0.7" y2="1">
    <stop stop-color="#f9f6ee"/><stop offset=".55" stop-color="#ddd9cc"/><stop offset="1" stop-color="#b7b4aa"/>
  </linearGradient>
  <filter id="budShadow" x="-80%" y="-80%" width="260%" height="260%">
    <feDropShadow dx="0" dy="15" stdDeviation="12" flood-color="#34443a" flood-opacity=".25"/>
  </filter>
  <g id="cloudBud">
    <rect x="-19" y="-34" width="38" height="143" rx="19" fill="url(#budStem)" stroke="#c6c1b5" stroke-opacity=".45"/>
    <path d="M-31 -69 C-31 -112 31 -112 31 -69 C31 -37 17 -21 0 -21 C-17 -21 -31 -37 -31 -69Z" fill="url(#budBody)" stroke="#d6d0c3" stroke-opacity=".6"/>
    <ellipse cx="0" cy="-58" rx="17" ry="12" fill="#b9b8ac" opacity=".55"/>
    <ellipse cx="0" cy="-58" rx="11" ry="7" fill="#8f948b" opacity=".35"/>
    <circle cx="0" cy="-80" r="4.5" fill="#8ba091" opacity=".7"/>
    <path d="M-17 -82 C-8 -100 9 -101 19 -87" stroke="#ffffff" stroke-opacity=".72" stroke-width="2" stroke-linecap="round"/>
    <circle cx="0" cy="97" r="4" fill="#8d968b" opacity=".55"/>
  </g>
</defs>

<ellipse cx="480" cy="600" rx="240" ry="34" fill="#4d6553" opacity=".16" filter="url(#blurSoft)"/>

<g transform="translate(346 330) rotate(-23) scale(.98)" filter="url(#budShadow)">
  <use href="#cloudBud"/>
</g>
<g transform="translate(614 302) rotate(18) scale(.91)" filter="url(#budShadow)">
  <use href="#cloudBud"/>
</g>

<g filter="url(#drop)">
  <rect x="354" y="440" width="252" height="145" rx="69" fill="url(#caseBody)"/>
  <path d="M354 490 C414 470 546 470 606 490" stroke="#b9b5a8" stroke-width="1.4" stroke-opacity=".55"/>
  <rect x="365" y="451" width="230" height="123" rx="61" fill="url(#sheen)" opacity=".42"/>
  <circle cx="480" cy="520" r="4" fill="#79917e"/>
  <circle cx="480" cy="520" r="7.5" stroke="#728874" stroke-opacity=".22"/>
  <path d="M382 470 C414 449 547 446 580 465" stroke="#fffdf7" stroke-width="2" stroke-opacity=".58" stroke-linecap="round"/>
</g>

<g fill="none" stroke="#5c7865">
  <path d="M258 278 C226 246 225 210 249 181" stroke-opacity=".35"/>
  <path d="M245 294 C196 248 193 196 227 152" stroke-opacity=".18"/>
  <path d="M687 363 C728 340 745 310 739 278" stroke-opacity=".3"/>
  <circle cx="758" cy="252" r="3" fill="#718a76" stroke="none"/>
  <circle cx="775" cy="277" r="2" fill="#718a76" stroke="none"/>
</g>
<g transform="translate(250 490)" opacity=".8">
  <rect width="123" height="31" rx="15.5" fill="#f6f3e9" fill-opacity=".46" stroke="#697d6c" stroke-opacity=".25"/>
  <circle cx="18" cy="15.5" r="4" fill="#8ba28d"/>
  <text x="30" y="19.5" fill="#435548" font-family="Helvetica, Arial, sans-serif" font-size="8" letter-spacing="1.8">OPEN SOUND</text>
</g>
<g fill="#2f3c32" opacity=".38" font-family="Helvetica, Arial, sans-serif">
  <text x="48" y="676" font-size="8.5" letter-spacing="3.2">JIANWU SELECT · OBJECT STUDY 2026</text>
</g>
<g transform="translate(900 672)">
  <circle cx="0" cy="0" r="4" fill="#7f9a80"/>
  <circle cx="16" cy="0" r="4" stroke="#2f3c32" stroke-opacity=".4"/>
</g>
</svg>