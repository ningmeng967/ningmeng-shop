<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" fill="none">
<title>环宇 Air 立式循环扇展示插画</title>
<defs>
  <linearGradient id="bg" x1="120" y1="20" x2="840" y2="700" gradientUnits="userSpaceOnUse">
    <stop stop-color="#cddde0"/><stop offset="0.55" stop-color="#e0e5dd"/><stop offset="1" stop-color="#eee7db"/>
  </linearGradient>
  <pattern id="microdots" width="20" height="20" patternUnits="userSpaceOnUse">
