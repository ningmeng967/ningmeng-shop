  </linearGradient>
  <linearGradient id="graphite" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#48534c"/><stop offset=".32" stop-color="#202923"/><stop offset=".75" stop-color="#111714"/><stop offset="1" stop-color="#333e37"/>
