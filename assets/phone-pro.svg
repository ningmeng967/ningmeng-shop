  <linearGradient id="backSheen" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#a9b2aa" stop-opacity=".16"/><stop offset=".4" stop-color="#fff" stop-opacity="0"/><stop offset=".78" stop-color="#fff" stop-opacity=".06"/>
  </linearGradient>
  
  <linearGradient id="screenPro" x1="0" y1="0" x2="0.8" y2="1">
