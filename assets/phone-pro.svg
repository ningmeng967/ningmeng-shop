  <text x="912" y="55" font-size="10.5" letter-spacing="2.6" text-anchor="end">01 / 04</text>
</g>
<line x1="48" y1="77" x2="912" y2="77" stroke="#3c2b24" stroke-opacity=".14"/>
<defs>
  <linearGradient id="metalEdge" x1="0" y1="0" x2="1" y2="0">
