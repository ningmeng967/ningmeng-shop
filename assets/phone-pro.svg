      <rect x="70" y="37" width="78" height="6" rx="3" fill="#fff1e2" opacity=".35"/>
      <rect x="70" y="50" width="92" height="6" rx="3" fill="#fff1e2" opacity=".25"/>
    </g>
    <path d="M279 143 L553 143 L553 280 C442 232 350 292 279 382 Z" fill="url(#sheen)" opacity=".5"/>
